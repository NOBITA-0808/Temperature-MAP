{% extends 'base.html' %}{% block body %}<main class="wrap narrow panel"><h1>メンバーログイン</h1><p>講座で配布されたID・パスワードを入力してください。</p>{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label for="username">ID</label><input id="username" name="username" autocomplete="username" maxlength="40" required><label for="password">パスワード</label><input id="password" type="password" name="password" autocomplete="current-password" maxlength="128" required><p><button>ログイン</button></p></form></main>{% endblock %}
