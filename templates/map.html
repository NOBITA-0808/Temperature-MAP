<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pico W センサーマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; color: #222; }
    header { padding: 12px 16px; background: #f3f3f3; border-bottom: 1px solid #ddd; }
    header h2 { margin: 0 0 4px; }
    #map { height: 58vh; }
    .panel { padding: 14px 16px; }
    .small { color: #666; font-size: 0.9em; }
    table { border-collapse: collapse; width: 100%; font-size: 0.95em; }
    th, td { border: 1px solid #ccc; padding: 7px; text-align: left; }
    th { background: #f7f7f7; }
    tr:hover { background: #fffbe8; cursor: pointer; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .toolbar button, .toolbar a { padding: 7px 10px; border: 1px solid #ccc; background: #fff; text-decoration: none; color: #222; border-radius: 5px; }
    .temp-label { background: white; border: 1px solid #555; border-radius: 14px; padding: 2px 7px; font-weight: bold; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
    #chartBox { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-top: 12px; }
    #chartTitle { margin: 0 0 8px; }
  </style>
</head>
<body>
  <header>
    <h2>Pico W センサーマップ</h2>
    <div class="small">MicroPython → Render → SQLite。地図は各端末の最新値、グラフは過去24時間の履歴です。</div>
  </header>

  <div id="map"></div>

  <div class="panel">
    <div class="toolbar">
      <button onclick="loadLatest()">最新データ更新</button>
      <a href="/download.csv">CSVダウンロード</a>
      <span class="small">行またはマーカーをクリックすると24時間グラフを表示します。</span>
    </div>

    <h3>最新データ一覧</h3>
    <table>
      <thead>
        <tr>
          <th>名前</th>
          <th>気温(℃)</th>
          <th>湿度(%)</th>
          <th>気圧(hPa)</th>
          <th>更新時刻</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div id="chartBox">
      <h3 id="chartTitle">過去24時間グラフ</h3>
      <canvas id="historyChart" height="110"></canvas>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const map = L.map('map').setView([35.02, 135.86], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let markers = [];
    let chart = null;

    function fmt(value, digits=1) {
      if (value === null || value === undefined || value === '') return '';
      const n = Number(value);
      return Number.isFinite(n) ? n.toFixed(digits) : value;
    }

    function clearMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }

    async function loadLatest() {
      const res = await fetch('/api/latest');
      const data = await res.json();

      clearMarkers();
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      const bounds = [];

      data.forEach(item => {
        const name = item.device_name ?? '';
        const tempText = fmt(item.temp, 1);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${name}</td>
          <td>${fmt(item.temp, 2)}</td>
          <td>${fmt(item.hum, 2)}</td>
          <td>${fmt(item.press, 2)}</td>
          <td>${item.updated_at ?? ''}</td>
        `;
        tr.onclick = () => loadHistory(name);
        tbody.appendChild(tr);

        if (item.lat != null && item.lng != null) {
          const marker = L.marker([item.lat, item.lng]).addTo(map);
          marker.bindTooltip(`${tempText}℃`, { permanent: true, direction: 'top', className: 'temp-label' });
          marker.bindPopup(`
            <b>${name}</b><br>
            気温: ${fmt(item.temp, 2)} ℃<br>
            湿度: ${fmt(item.hum, 2)} %<br>
            気圧: ${fmt(item.press, 2)} hPa<br>
            更新: ${item.updated_at ?? ''}<br>
            <button onclick="loadHistory('${name.replaceAll("'", "\\'")}')">24時間グラフ</button>
          `);
          marker.on('click', () => loadHistory(name));
          markers.push(marker);
          bounds.push([item.lat, item.lng]);
        }
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
        if (data.length > 0 && !chart) loadHistory(data[0].device_name);
      }
    }

    async function loadHistory(name) {
      if (!name) return;
      document.getElementById('chartTitle').textContent = `${name} の過去24時間グラフ`;
      const res = await fetch(`/api/history?name=${encodeURIComponent(name)}&hours=24&limit=2000`);
      const rows = await res.json();

      const labels = rows.map(r => {
        const d = new Date(r.created_at);
        if (isNaN(d.getTime())) return r.created_at;
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      });

      const ctx = document.getElementById('historyChart').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: '気温 ℃', data: rows.map(r => r.temp), tension: 0.25 },
            { label: '湿度 %', data: rows.map(r => r.hum), tension: 0.25 },
            {
                label: '気圧 hPa',
                data: rows.map(r => r.press),
                tension: 0.25,
                yAxisID: 'yPressure'
             }
          ]
        },
        options: {
          responsive: true,
          interaction: { mode: 'index', intersect: false },
          plugins: { legend: { position: 'top' } },
          scales: {
            x: {
                ticks: { maxTicksLimit: 12 }
            },
            y: {
                position: 'left'
            },
            yPressure: {
                position: 'right',
                min: 950,
                max: 1050,
                grid: {
                    drawOnChartArea: false
                },
                title: {
                    display: true,
                    text: '気圧 (hPa)'
                 }
            }
        }
          
        }
      });
    }

    loadLatest();
    setInterval(loadLatest, 30000);
  </script>
</body>
</html>
